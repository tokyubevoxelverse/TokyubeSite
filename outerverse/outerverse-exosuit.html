<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OUTERVERSE — Procedural Exosuit Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#dfe9f2; --dim:#8fa3b8; --line:rgba(150,190,230,.14);
  --glass:rgba(8,13,22,.78); --glass2:rgba(13,20,33,.66);
  --cy:#67e8f9; --cy2:#22d3ee; --warn:#ffb454;
  --r:14px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; background:#05070d; color:var(--ink);
  font:13px/1.45 "Rajdhani","Segoe UI",system-ui,sans-serif; font-weight:500;}
#view{position:fixed; inset:0;}
canvas{display:block;}

/* ---------- left panel ---------- */
#panel{position:fixed; left:12px; top:12px; bottom:12px; width:288px; z-index:20;
  display:flex; flex-direction:column; background:var(--glass);
  border:1px solid var(--line); border-radius:var(--r);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .3s ease;}
#panel.closed{transform:translateX(-320px);}
#panel-head{padding:14px 16px 10px; border-bottom:1px solid var(--line);}
#panel-head h1{font-family:"Orbitron",monospace; font-size:17px; letter-spacing:.14em; font-weight:800;
  background:linear-gradient(90deg,#fff,var(--cy)); -webkit-background-clip:text; background-clip:text; color:transparent;}
#panel-head .sub{font-size:10px; letter-spacing:.34em; color:var(--dim); text-transform:uppercase; margin-top:2px;}
#panel-body{flex:1; overflow-y:auto; padding:6px 16px 16px; scrollbar-width:thin; scrollbar-color:#2b3b52 transparent;}
#panel-body::-webkit-scrollbar{width:6px;}
#panel-body::-webkit-scrollbar-thumb{background:#263650; border-radius:3px;}

.sec{margin-top:14px;}
.sec > .t{font-size:10px; font-weight:700; letter-spacing:.28em; text-transform:uppercase;
  color:var(--cy); opacity:.85; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.sec > .t::after{content:""; flex:1; height:1px; background:var(--line);}

.row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
.row label{flex:1; color:var(--dim); font-size:12px; letter-spacing:.04em;}
input[type=text]{flex:1; min-width:0; background:var(--glass2); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); padding:7px 10px; font:600 13px "Rajdhani",sans-serif; letter-spacing:.08em; outline:none;}
input[type=text]:focus{border-color:var(--cy2);}
input[type=color]{width:40px; height:26px; border:1px solid var(--line); border-radius:7px;
  background:none; padding:2px; cursor:pointer;}
select{flex:1.35; background:var(--glass2); border:1px solid var(--line); border-radius:8px; color:var(--ink);
  padding:7px 8px; font:600 12px "Rajdhani",sans-serif; outline:none; cursor:pointer;}
select:focus{border-color:var(--cy2);}
input[type=range]{flex:1.35; accent-color:var(--cy2); cursor:pointer;}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--cy2); cursor:pointer;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; user-select:none;
  background:var(--glass2); border:1px solid var(--line); border-radius:9px; color:var(--ink);
  padding:8px 10px; font:700 12px "Rajdhani",sans-serif; letter-spacing:.1em; text-transform:uppercase;
  transition:border-color .15s, background .15s, transform .05s;}
.btn:hover{border-color:var(--cy2); background:rgba(34,211,238,.10);}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg, rgba(34,211,238,.22), rgba(34,211,238,.08));
  border-color:rgba(34,211,238,.55); color:#d9fbff;}
.btn.wide{width:100%;}
.btn.dice{width:38px; flex:none; font-size:15px;}

.swatches{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
.sw{cursor:pointer; border:1px solid var(--line); border-radius:9px; padding:6px 6px 5px; background:var(--glass2);
  transition:border-color .15s; text-align:center;}
.sw:hover{border-color:var(--cy2);}
.sw .chips{display:flex; height:14px; border-radius:5px; overflow:hidden; margin-bottom:4px;
  border:1px solid rgba(255,255,255,.10);}
.sw .chips i{flex:1;}
.sw span{font-size:9px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; font-weight:700;}

.note{font-size:10.5px; color:var(--dim); letter-spacing:.03em; line-height:1.5; margin-top:10px;
  border-top:1px solid var(--line); padding-top:10px;}

/* ---------- bottom animation dock ---------- */
#anims{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20;
  display:flex; gap:6px; padding:6px; background:var(--glass); border:1px solid var(--line);
  border-radius:999px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 12px 40px rgba(0,0,0,.5);}
.pill{cursor:pointer; border:1px solid transparent; border-radius:999px; padding:7px 14px;
  font:700 12px "Rajdhani",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  transition:all .15s; white-space:nowrap;}
.pill:hover{color:var(--ink);}
.pill.on{color:#062026; background:linear-gradient(135deg,var(--cy),var(--cy2));
  box-shadow:0 0 18px rgba(34,211,238,.45);}

/* ---------- top-right toggles ---------- */
#corner{position:fixed; right:14px; top:14px; z-index:20; display:flex; gap:8px;}
.tog{display:flex; align-items:center; gap:6px; padding:7px 11px; background:var(--glass);
  border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(14px);
  font:700 11px "Rajdhani",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--dim);
  cursor:pointer; user-select:none;}
.tog.on{color:var(--cy); border-color:rgba(34,211,238,.4);}

#menuBtn{position:fixed; left:14px; top:14px; z-index:30; display:none;}

#hint{position:fixed; right:16px; bottom:16px; z-index:15; font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:rgba(160,190,220,.5); pointer-events:none;}

/* ---------- loading / error ---------- */
#loading{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:18px;
  align-items:center; justify-content:center; background:#05070d; transition:opacity .5s;}
#loading.hide{opacity:0; pointer-events:none;}
#loading .ring{width:54px; height:54px; border-radius:50%; border:2px solid rgba(103,232,249,.15);
  border-top-color:var(--cy); animation:spin 1s linear infinite;}
#loading .txt{font-family:"Orbitron",monospace; font-size:12px; letter-spacing:.3em; color:var(--dim); text-transform:uppercase;}
@keyframes spin{to{transform:rotate(360deg);}}
#err{position:fixed; inset:auto 16px 16px 16px; z-index:60; display:none; background:rgba(60,10,15,.92);
  border:1px solid #a33; border-radius:10px; padding:12px 14px; font:12px monospace; color:#ffd7d7; white-space:pre-wrap;}

@media (max-width:760px){
  #panel{width:min(288px, 84vw); top:58px;}
  #panel.closed ~ #menuBtn{display:inline-flex;}
  #menuBtn{display:inline-flex;}
  #anims{max-width:94vw; overflow-x:auto;}
  #hint{display:none;}
}
.duo{display:flex;gap:7px;align-items:center}
input.mini{width:62px}
.vpills{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.vp{padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#dfe7f2;font:600 11.5px/1 Rajdhani,sans-serif;letter-spacing:.4px;cursor:pointer}
.vp:hover{border-color:rgba(255,255,255,.4)}
.vp.on{background:#67e8f9;border-color:#67e8f9;color:#082129}
</style>
</head>
<body>
<div id="view"></div>

<div id="panel">
  <div id="panel-head">
    <h1>OUTERVERSE</h1>
    <div class="sub">Exosuit Forge // Procedural Rig</div>
  </div>
  <div id="panel-body"></div>
</div>
<button id="menuBtn" class="btn">☰ Forge</button>

<div id="anims"></div>

<div id="corner">
  <div class="tog on" id="togRotate">⟳ Orbit</div>
  <div class="tog on" id="togFx">✦ FX</div>
</div>

<div id="hint">Drag to orbit · Scroll to zoom</div>

<div id="loading"><div class="ring"></div><div class="txt">Assembling exosuit</div></div>
<div id="err"></div>

<script type="module">
/* ============================================================
   BOOT — multi-CDN loader (no addons needed; core three only)
============================================================ */
const errBox = document.getElementById('err');
const loadTxt = document.querySelector('#loading .txt');
function showFatal(msg){
  errBox.style.display = 'block';
  errBox.textContent = msg;
  if (loadTxt) loadTxt.textContent = 'Failed to start';
}
window.addEventListener('error', e => showFatal('Error: ' + (e.message || e.error)));
window.addEventListener('unhandledrejection', e => showFatal('Error: ' + (e.reason && e.reason.message || e.reason)));

const CDNS = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0',
];
async function loadThree(){
  for (const url of CDNS){
    try { const m = await import(url); if (m && m.WebGLRenderer) return m; } catch (e) {}
  }
  return null;
}
const THREE = (typeof globalThis.__THREE_TEST__ !== 'undefined') ? globalThis.__THREE_TEST__ : await loadThree();
if (!THREE){
  showFatal('Could not load three.js from any CDN.\nCheck your internet connection / firewall and reload.');
  throw new Error('three.js unavailable');
}
if (loadTxt) loadTxt.textContent = 'Assembling exosuit';

/* ==CORE-START== (renderer-free: geometry, rig, animation, GLB) */
const ui = {};   // hooks filled by the app layer

/* ---------------- seeded rng + palettes ---------------- */
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hsl = (h, s, l) => '#' + new THREE.Color().setHSL(((h % 1) + 1) % 1, s, l).getHexString();
function genPalette(rng){
  const h = rng();
  const light = rng() < 0.62;
  const base   = light ? hsl(h, 0.06 + rng() * 0.16, 0.82 + rng() * 0.10)
                       : hsl(h, 0.18 + rng() * 0.25, 0.13 + rng() * 0.09);
  const panel  = light ? hsl(h + 0.04, 0.20 + rng() * 0.25, 0.24 + rng() * 0.14)
                       : hsl(h + 0.05, 0.12 + rng() * 0.2, 0.42 + rng() * 0.18);
  const ah = h + 0.38 + rng() * 0.28;
  const accent = hsl(ah, 0.78 + rng() * 0.2, 0.5 + rng() * 0.12);
  const glow   = hsl(ah + (rng() < 0.5 ? 0.08 : -0.35), 0.95, 0.6 + rng() * 0.08);
  const under  = hsl(h + 0.5, 0.12, 0.11 + rng() * 0.05);
  const metal  = hsl(h, 0.08, 0.16 + rng() * 0.08);
  const visors = ['#d8a63c', '#12161f', '#1b3346', hsl(ah, 0.7, 0.28), '#3c1230'];
  const visor  = visors[(rng() * visors.length) | 0];
  const screen = hsl(h + 0.5, 0.35, 0.06 + rng() * 0.05);
  return { base, panel, accent, under, metal, glow, visor, screen };
}

/* ---------------- config / state ---------------- */
const PRESETS = [
  ['Crimson Ash',  { base:'#d5222c', panel:'#17171b', accent:'#ff5a3c', under:'#1a1114', metal:'#26262e', glow:'#ff2e4d', visor:'#0e0e12', screen:'#160a0d' }],
  ['Ember Silver', { base:'#f07818', panel:'#c9ced6', accent:'#ffb03a', under:'#2a2019', metal:'#b4bcc8', glow:'#ff7a1a', visor:'#20242c', screen:'#181008' }],
  ['Wasp Sting',   { base:'#ffd21f', panel:'#101014', accent:'#ffaa00', under:'#17150e', metal:'#1d1d24', glow:'#fff268', visor:'#0c0c10', screen:'#141204' }],
  ['Mint Lime',    { base:'#1fae5e', panel:'#f2f7f3', accent:'#9dff2e', under:'#12241c', metal:'#2f3b35', glow:'#66ffc2', visor:'#0f1f18', screen:'#0a1812' }],
  ['Cobalt Silver',{ base:'#1f5fd6', panel:'#c7cdd8', accent:'#38c6ff', under:'#131a26', metal:'#aab3c2', glow:'#4fa8ff', visor:'#0e1626', screen:'#0a1120' }],
  ['Violet Noir',  { base:'#7a2fd8', panel:'#141019', accent:'#b44dff', under:'#150f1e', metal:'#231d2e', glow:'#c05aff', visor:'#0d0a14', screen:'#120a1c' }],
  ['Rosa Blanc',   { base:'#ff4f9a', panel:'#f7f2f6', accent:'#ff7ab4', under:'#2a1a22', metal:'#3c2e36', glow:'#ff5fb0', visor:'#1c1218', screen:'#190d14' }],
  ['Mono Sterling',{ base:'#f2f4f7', panel:'#121317', accent:'#b8bfca', under:'#1a1c21', metal:'#c9d0da', glow:'#e8f1ff', visor:'#0c0d11', screen:'#101216' }],
  ['Spectrum',     { base:'#ff3d55', panel:'#2f7bff', accent:'#ffd21f', under:'#221a2e', metal:'#c0c6d0', glow:'#3dff88', visor:'#ff8a00', screen:'#160f22' }],
  ['Gilded Onyx',  { base:'#101014', panel:'#1c1c22', accent:'#f5c542', under:'#131318', metal:'#d4af37', glow:'#ffd76a', visor:'#151310', screen:'#171205' }],
];
const PART_DEFS = {
  helmet: ['Voyager Dome', 'Horizon Optic', 'Vanguard Frame', 'Crowbot Viseme', 'Crowbot Spiked', 'Crowbot Evil', 'Evil Spiked', 'Corsair Wrap', 'Ronin Crest', 'Doom Cloak'],
  chest:  ['Reactor Core', 'Panel Array', 'Strato Rig', 'Twin Core', 'Vent Matrix', 'Command Node'],
  pack:   ['Aether Pack', 'Twin Cell', 'Field Pack', 'Mecha Wings', 'Vector Thrusters', 'Halo Drive', 'Wind Cape'],
  shoulders: ['Dome Guard', 'Spiked Guard', 'Blade Stack', 'Bare Joint', 'Horned Guard', 'Lamp Dome'],
  hands: ['Standard Glove', 'Heavy Gauntlet', 'Blade Gauntlet', 'Power Fist', 'Spiked Gauntlet', 'Tech Bracer'],
  attach: ['Shoulder Scope', 'Beacon Lamp', 'Long Antenna', 'Sensor Array', 'Banner Fin', 'None'],
  belt:   ['Utility Belt', 'Slim Band', 'Tasset Plates', 'Combat Sash', 'Chain Links', 'Holster Rig'],
  knees:  ['Armored Pads', 'Ribbed Joints', 'Spiked Pads', 'Strap Guard', 'Blade Fin', 'Guard Cage'],
  boots:  ['Standard Boots', 'Spiked Boots', 'Heavy Treads', 'Sleek Runners', 'Plated Greaves', 'Mag Boots'],
};
const state = {
  seed: 'ATLAS-16',
  colors: { ...PRESETS[0][1] },
  parts: { helmet: 0, chest: 0, pack: 0, shoulders: 0, hands: 0, attach: 0, belt: 0, knees: 0, boots: 0 },
  stripes: true,
  greebles: true,
  name: 'TOH',
  autoRotate: true,
  fx: true,
  viseme: 'AA',
  talk: false,
  glowInt: 2.6,
  windStr: 0.8,
  windDir: 195,
  surf: {
    base:  { m: 0.18, r: 0.55 },
    panel: { m: 0.30, r: 0.50 },
    accent:{ m: 0.22, r: 0.45 },
    metal: { m: 0.95, r: 0.32 },
    under: { m: 0.05, r: 0.88 },
    visor: { m: 0.90, r: 0.10 },
  },
};
const cleanSeed = () => state.seed.replace(/[^A-Za-z0-9_-]/g, '') || 'suit';

/* ---------------- skeleton (20 joints, built once) ---------------- */
const charGroup = new THREE.Group();
charGroup.name = 'OuterVerse';
const BONE_DEFS = [
  ['root',      null,       [0, 0, 0]],
  ['pelvis',    'root',     [0, 0.97, 0]],
  ['spine',     'pelvis',   [0, 0.15, 0]],
  ['chest',     'spine',    [0, 0.19, 0]],
  ['neck',      'chest',    [0, 0.185, 0]],
  ['head',      'neck',     [0, 0.095, 0]],
  ['shoulderL', 'chest',    [0.165, 0.115, 0]],
  ['upperArmL', 'shoulderL',[0.078, -0.018, 0]],
  ['forearmL',  'upperArmL',[0, -0.30, 0]],
  ['handL',     'forearmL', [0, -0.27, 0]],
  ['shoulderR', 'chest',    [-0.165, 0.115, 0]],
  ['upperArmR', 'shoulderR',[-0.078, -0.018, 0]],
  ['forearmR',  'upperArmR',[0, -0.30, 0]],
  ['handR',     'forearmR', [0, -0.27, 0]],
  ['thighL',    'pelvis',   [0.108, -0.035, 0]],
  ['shinL',     'thighL',   [0, -0.39, 0]],
  ['footL',     'shinL',    [0, -0.44, 0]],
  ['thighR',    'pelvis',   [-0.108, -0.035, 0]],
  ['shinR',     'thighR',   [0, -0.39, 0]],
  ['footR',     'shinR',    [0, -0.44, 0]],
];
const bones = [], B = {}, BI = {}, restPos = {};
for (const [name, parent, p] of BONE_DEFS){
  const b = new THREE.Bone();
  b.name = 'J_' + name;
  b.position.set(p[0], p[1], p[2]);
  restPos[name] = new THREE.Vector3(p[0], p[1], p[2]);
  BI[name] = bones.length; bones.push(b); B[name] = b;
  if (parent) B[parent].add(b);
}
charGroup.add(B.root);
charGroup.updateMatrixWorld(true);
const skeleton = new THREE.Skeleton(bones);
const IDENT = new THREE.Matrix4();
const Y = { pelvis: 1.02, spine: 1.17, chest: 1.36, neck: 1.545, head: 1.64,
            shoulder: 1.475, arm: 1.457, elbow: 1.157, hand: 0.887,
            hip: 0.985, knee: 0.545, ankle: 0.105 };
const X = { arm: 0.243, leg: 0.108 };
const LEGDY = 0.05;   // thigh shortening: geometry above the knees drops with the bones

/* ---------------- materials ---------------- */
const MATS = {
  base:  new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.18 }),
  panel: new THREE.MeshStandardMaterial({ roughness: 0.50, metalness: 0.30 }),
  accent:new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.22 }),
  under: new THREE.MeshStandardMaterial({ roughness: 0.88, metalness: 0.05 }),
  metal: new THREE.MeshStandardMaterial({ roughness: 0.32, metalness: 0.95 }),
  glow:  new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.1, emissiveIntensity: 2.6 }),
  visor: new THREE.MeshPhysicalMaterial({ roughness: 0.10, metalness: 0.9, clearcoat: 1, clearcoatRoughness: 0.12 }),
};
const plateCv = document.createElement('canvas'); plateCv.width = 256; plateCv.height = 84;
const plateTex = new THREE.CanvasTexture(plateCv); plateTex.colorSpace = THREE.SRGBColorSpace;
plateTex.anisotropy = 4;
const plateMat = new THREE.MeshStandardMaterial({ map: plateTex, roughness: 0.5, metalness: 0.1 });
function redrawPlate(){
  const g = plateCv.getContext('2d');
  g.fillStyle = '#eceae4'; g.fillRect(0, 0, 256, 84);
  g.fillStyle = state.colors.accent; g.fillRect(0, 0, 22, 84);
  g.fillStyle = '#14161c';
  g.font = '700 44px Rajdhani, sans-serif'; g.textBaseline = 'middle';
  g.fillText((state.name || 'PILOT').toUpperCase().slice(0, 10), 34, 34);
  g.font = '600 17px Rajdhani, sans-serif'; g.fillStyle = '#5a6472';
  g.fillText('OUTERVERSE EXO CREW', 34, 67);
  plateTex.needsUpdate = true;
}
redrawPlate();

/* ---------------- Eddy face screen + visemes ---------------- */
const VISEMES = ['REST', 'AA', 'EE', 'IH', 'OH', 'OU', 'MM', 'FF', 'TH', 'SS', 'CH', 'LL'];
const FACE_HELMS = [3, 4, 5, 6, 9], EVIL_HELMS = [5, 6, 9];
const helmFace = () => FACE_HELMS.includes(state.parts.helmet);
const helmEvil = () => EVIL_HELMS.includes(state.parts.helmet);
const faceCv = document.createElement('canvas'); faceCv.width = 512; faceCv.height = 512;
const faceTex = new THREE.CanvasTexture(faceCv);
faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 4;
const faceMat = new THREE.MeshStandardMaterial({
  color: 0x000000, roughness: 0.4, metalness: 0,
  emissive: 0x67e8f9, emissiveMap: faceTex, emissiveIntensity: 2.2,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const sglassMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0e14, roughness: 0.07, metalness: 0.55, clearcoat: 1, clearcoatRoughness: 0.06 });
const capeMat = new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.04, side: THREE.DoubleSide });
const hoodMat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.02, side: THREE.DoubleSide });
const capeCullU = { cullOn: { value: 0 } };
capeMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, capeCullU);
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vCapeW;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCapeW = (modelMatrix * vec4(position, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vCapeW;\nuniform float cullOn;')
    .replace('#include <clipping_planes_fragment>',
      'if (cullOn > 0.5 && vCapeW.y > 1.475 && vCapeW.y < 1.84){' +
      ' float tH = clamp(1.818 - vCapeW.y, 0.0, 0.345);' +
      ' float hr = 0.068 + 0.958 * tH - 1.25 * tH * tH;' +
      ' if (length(vCapeW.xz - vec2(0.0, -0.012)) < hr) discard; }' +

function roundedBox(w, h, d, r = 0.03, seg = 3){
  r = Math.min(r, w / 2.02, h / 2.02, d / 2.02);
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const p = g.attributes.position, n = g.attributes.normal;
  const hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r;
  const v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    c.set(THREE.MathUtils.clamp(v.x, -hx, hx), THREE.MathUtils.clamp(v.y, -hy, hy), THREE.MathUtils.clamp(v.z, -hz, hz));
    v.sub(c);
    const len = v.length();
    if (len > 1e-9){
      v.multiplyScalar(r / len);
      n.setXYZ(i, v.x / r, v.y / r, v.z / r);
    }
    p.setXYZ(i, c.x + v.x, c.y + v.y, c.z + v.z);
  }
  return g;
}
function mergeGeos(list){
  let vTotal = 0, iTotal = 0;
  for (const g of list){ vTotal += g.attributes.position.count; iTotal += g.index.count; }
  const pos = new Float32Array(vTotal * 3), nor = new Float32Array(vTotal * 3);
  const uv = new Float32Array(vTotal * 2), sw = new Float32Array(vTotal * 4);
  const si = new Uint16Array(vTotal * 4);
  const idx = new Uint32Array(iTotal);
  let vo = 0, io = 0;
  for (const g of list){
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3);
    nor.set(g.attributes.normal.array, vo * 3);
    uv.set(g.attributes.uv.array, vo * 2);
    si.set(g.attributes.skinIndex.array, vo * 4);
    sw.set(g.attributes.skinWeight.array, vo * 4);
    const ia = g.index.array;
    for (let i = 0; i < ia.length; i++) idx[io + i] = ia[i] + vo;
    io += ia.length; vo += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  out.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}
const RB  = (w, h, d, r = 0.03) => roundedBox(w, h, d, r);
const CYL = (r, h, seg = 20) => new THREE.CylinderGeometry(r, r, h, seg);
const CONE= (r1, r2, h, seg = 20) => new THREE.CylinderGeometry(r1, r2, h, seg);
const SPH = (r, w = 22, h = 15) => new THREE.SphereGeometry(r, w, h);
const CAP = (r, l, seg = 14) => new THREE.CapsuleGeometry(r, l, 5, seg);
const TOR = (r, t, arc = Math.PI * 2, seg = 40) => new THREE.TorusGeometry(r, t, 10, seg, arc);
const CIR = (r, seg = 32) => new THREE.CircleGeometry(r, seg);
function arcBand(r, t, arc){
  const g = new THREE.TorusGeometry(r, t, 9, 30, arc);
  g.rotateX(Math.PI / 2);
  g.rotateY(arc / 2 - Math.PI / 2);
  return g;
}
function rib(r, h, ribs = 4, amp = 0.14){
  const pts = [], N = ribs * 8;
  for (let i = 0; i <= N; i++){
    const f = i / N;
    const env = 0.9 + 0.1 * Math.sin(Math.PI * f);
    pts.push(new THREE.Vector2(r * env * (1 + amp * Math.sin(f * Math.PI * 2 * ribs)), -h / 2 + h * f));
  }
  return new THREE.LatheGeometry(pts, 18);
}
function bindRigid(g, bi){
  const n = g.attributes.position.count;
  const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  for (let i = 0; i < n; i++){ si[i * 4] = bi; sw[i * 4] = 1; }
  g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
}
function bindBlendY(g, a, b, y0, soft){
  const pos = g.attributes.position, n = pos.count;
  const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  for (let i = 0; i < n; i++){
    const wU = THREE.MathUtils.smoothstep(pos.getY(i), y0 - soft, y0 + soft);
    si[i * 4] = a; si[i * 4 + 1] = b;
    sw[i * 4] = wU; sw[i * 4 + 1] = 1 - wU;
  }
  g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));

const _e = new THREE.Euler(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3();

function P(key, g, t = {}, bind = 0){
  const p = t.p || [0, 0, 0], r = t.r || [0, 0, 0];

  _e.set(r[0], r[1], r[2]); _q.setFromEuler(_e);
  _v.set(p[0], p[1], p[2]); _s.set(sc[0], sc[1], sc[2]);
  g.applyMatrix4(new THREE.Matrix4().compose(_v, _q, _s));
  if (!g.index){
    const n = g.attributes.position.count;
    const ia = n > 65535 ? new Uint32Array(n) : new Uint16Array(n);
    for (let i = 0; i < n; i++) ia[i] = i;
    g.setIndex(new THREE.BufferAttribute(ia, 1));
  }
  if (typeof bind === 'number') bindRigid(g, bind);
  else bindBlendY(g, bind.a, bind.b, bind.y, bind.s);
  const wsi = g.attributes.skinIndex.array, wsw = g.attributes.skinWeight.array, wp = g.attributes.position;
  for (let i = 0; i < wp.count; i++){
    let wUp = 0;
    for (let k = 0; k < 4; k++){
      const bx = wsi[i * 4 + k];
      if (bx !== BI.shinL && bx !== BI.shinR && bx !== BI.footL && bx !== BI.footR) wUp += wsw[i * 4 + k];
    }
    if (wUp) wp.setY(i, wp.getY(i) - LEGDY * wUp);
  }
  buckets[key].push(g);
  return g;
}

function archGeo(w, h, r, depth, bevel){
  const sp = new THREE.Shape();
  sp.moveTo(-w / 2, -h / 2);
  sp.lineTo(-w / 2, h / 2 - r);
  sp.absarc(0, h / 2 - r, r, Math.PI, 0, true);
  sp.lineTo(w / 2, -h / 2);
  sp.closePath();
  const g = new THREE.ExtrudeGeometry(sp, {
    depth, bevelEnabled: bevel, bevelThickness: 0.012, bevelSize: 0.012,
    bevelSegments: 2, curveSegments: 26 });
  g.translate(0, 0, -depth / 2);
  return g;
}

function interpPts(pts, v){
  for (let k = 1; k < pts.length; k++)
    if (v <= pts[k][0]){
      const a = pts[k - 1], b = pts[k];
      const t = (v - a[0]) / (b[0] - a[0]);
      const tt = t * t * (3 - 2 * t);
      return a[1] + (b[1] - a[1]) * tt;
    }
  return pts[pts.length - 1][1];
}
function hoodSurf(scale){
  // parametric cowl: u wraps from one opening edge around the back to the other,
  // v runs peak -> hem. Opening width, silhouette radius, overhang and wrinkles
  // are all shaped curves — this is a sculpted surface, not a primitive.
  const U = 64, V = 40;
  const GAP = [[0, 0.02], [0.08, 0.14], [0.22, 0.72], [0.42, 1.02], [0.62, 0.88], [0.82, 0.80], [1, 0.96]];
  const RAD = [[0, 0.050], [0.10, 0.095], [0.26, 0.142], [0.45, 0.152], [0.65, 0.164], [0.85, 0.190], [1, 0.205]];
  const pos = [], uvA = [], idx = [];
  const pt = (u, v) => {
    const gap = interpPts(GAP, v);
    const rr = interpPts(RAD, v) * scale;
    const phi = gap + u * (Math.PI * 2 - 2 * gap);
    const wr = (0.004 + 0.018 * Math.pow(v, 1.8)) * scale *
      (Math.sin(phi * 9 + v * 2.0) + 0.45 * Math.sin(phi * 17 + 2.1));
    const r2 = rr + wr;
    const bk = 0.5 - 0.5 * Math.cos(phi);
    const edgeDist = Math.min(phi - gap, (Math.PI * 2 - gap) - phi);
    const r3 = r2 * (1 - 0.15 * Math.max(0, 1 - edgeDist / 1.1));
    const y = 0.185 - 0.315 * Math.pow(v, 0.92)
      - 0.012 * Math.sin(Math.PI * v) * bk
      - 0.012 * Math.pow(v, 4) * (0.5 + 0.5 * Math.sin(phi * 6 + 1));
    const fz = 0.028 * Math.exp(-Math.pow((v - 0.10) / 0.16, 2))
             + 0.012 * Math.exp(-Math.pow((v - 0.42) / 0.30, 2));
    return [Math.sin(phi) * r3, y, Math.cos(phi) * r3 + fz - 0.012];
  };
  for (let j = 0; j <= V; j++)
    for (let i = 0; i <= U; i++){
      const q = pt(i / U, j / V);
      pos.push(q[0], q[1], q[2]);
      uvA.push(i / U, 1 - j / V);
    }
  for (let j = 0; j < V; j++)
    for (let i = 0; i < U; i++){
      const a = j * (U + 1) + i, b = a + 1, c = a + U + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvA), 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const rimPts = [];
  for (let j = V; j >= 1; j--){ const q = pt(0, j / V); rimPts.push(new THREE.Vector3(q[0], q[1], q[2])); }
  for (let j = 1; j <= V; j++){ const q = pt(1, j / V); rimPts.push(new THREE.Vector3(q[0], q[1], q[2])); }
  const hemPts = [];
  for (let i = 0; i <= U; i++){ const q = pt(i / U, 1); hemPts.push(new THREE.Vector3(q[0], q[1], q[2])); }
  return { geo, rimPts, hemPts };
}

/* ---------------- Verlet cloth cape (wind + directional sway) ---------------- */
const CAPE = { on: false, mesh: null, geo: null, pos: null, prev: null,
  cons: [], pins: [], W: 11, H: 15, t: 0 };
function removeCape(){
  if (CAPE.mesh){
    charGroup.remove(CAPE.mesh);
    CAPE.geo.dispose();
    CAPE.mesh = null; CAPE.geo = null;
  }
  CAPE.on = false;
}
function initCape(){
  removeCape();
  const W = CAPE.W, H = CAPE.H, n = W * H;
  const len = 0.88;
  const halfW = r => 0.150 + 0.190 * Math.sin(Math.min(1, (r / (H - 1)) / 0.8) * Math.PI * 0.5);
  CAPE.pos = new Float32Array(n * 3);
  CAPE.prev = new Float32Array(n * 3);
  for (let r = 0; r < H; r++)
    for (let c = 0; c < W; c++){
      const i = (r * W + c) * 3;
      const u = c / (W - 1);
      CAPE.pos[i] = (u * 2 - 1) * halfW(r);
      CAPE.pos[i + 1] = 1.455 - len * r / (H - 1)
        - (r === H - 1 ? 0.085 * Math.abs(Math.cos(Math.PI * u)) : 0);
      CAPE.pos[i + 2] = -0.155 - 0.06 * (r / (H - 1));
      CAPE.prev[i] = CAPE.pos[i]; CAPE.prev[i + 1] = CAPE.pos[i + 1]; CAPE.prev[i + 2] = CAPE.pos[i + 2];
    }
  CAPE.cons = [];
  const D = (a, b) => {
    const ia = a * 3, ib = b * 3;
    return Math.hypot(CAPE.pos[ia] - CAPE.pos[ib], CAPE.pos[ia + 1] - CAPE.pos[ib + 1], CAPE.pos[ia + 2] - CAPE.pos[ib + 2]);
  };
  for (let r = 0; r < H; r++)
    for (let c = 0; c < W; c++){
      const i = r * W + c;
      if (c < W - 1) CAPE.cons.push([i, i + 1, D(i, i + 1)]);
      if (r < H - 1) CAPE.cons.push([i, i + W, D(i, i + W)]);
      if (c < W - 1 && r < H - 1){ CAPE.cons.push([i, i + W + 1, D(i, i + W + 1)]); CAPE.cons.push([i + 1, i + W, D(i + 1, i + W)]); }
    }
  CAPE.pins = [];
  for (let c = 0; c < W; c++)
    CAPE.pins.push([c, new THREE.Vector3((c / (W - 1) * 2 - 1) * halfW(0), 0.145, -0.155)]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(CAPE.pos, 3));
  const uv = new Float32Array(n * 2);
  for (let r = 0; r < H; r++)
    for (let c = 0; c < W; c++){ uv[(r * W + c) * 2] = c / (W - 1); uv[(r * W + c) * 2 + 1] = 1 - r / (H - 1); }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  const idx = [];
  for (let r = 0; r < H - 1; r++)
    for (let c = 0; c < W - 1; c++){
      const a = r * W + c, b = a + 1, cc = a + W, dd = a + W + 1;
      idx.push(a, cc, b, b, cc, dd);
    }
  geo.setIndex(idx);
  geo.computeVertexNormals();
  CAPE.mesh = new THREE.Mesh(geo, capeMat);
  CAPE.mesh.castShadow = true;
  CAPE.mesh.frustumCulled = false;
  CAPE.mesh.name = 'OuterVerse_cape';
  charGroup.add(CAPE.mesh);
  CAPE.geo = geo;
  CAPE.on = true;
}
const _cv1 = new THREE.Vector3();
function updateCape(dt){
  if (!CAPE.on) return;
  CAPE.t += dt;
  const sub = Math.min(dt, 1 / 30);
  charGroup.updateMatrixWorld(true);
  const m = B.chest.matrixWorld;
  const jw = [];
  for (const bn of ['thighL', 'shinL', 'footL', 'thighR', 'shinR', 'footR']){
    _cv1.setFromMatrixPosition(B[bn].matrixWorld);
    jw.push(_cv1.x, _cv1.y, _cv1.z);
  }
  const p = CAPE.pos, pr = CAPE.prev, t = CAPE.t;
  const dir = state.windDir * Math.PI / 180;
  const gust = state.windStr * (0.55 + 0.45 * Math.sin(t * 1.7) + 0.28 * Math.sin(t * 3.31 + 1.3));
  const wx = Math.sin(dir) * gust, wz = Math.cos(dir) * gust;
  const g2 = sub * sub;
  for (let i = 0; i < p.length; i += 3){
    const ripple = 1 + 0.35 * Math.sin(t * 4.1 + p[i] * 7 + p[i + 1] * 3.2);
    const vx = (p[i] - pr[i]) * 0.985, vy = (p[i + 1] - pr[i + 1]) * 0.985, vz = (p[i + 2] - pr[i + 2]) * 0.985;
    pr[i] = p[i]; pr[i + 1] = p[i + 1]; pr[i + 2] = p[i + 2];
    p[i] += vx + wx * ripple * g2;
    p[i + 1] += vy - 2.6 * g2;
    p[i + 2] += vz + wz * ripple * g2;
  }
  for (let it = 0; it < 3; it++){
    for (const [a, b, rest] of CAPE.cons){
      const ia = a * 3, ib = b * 3;
      let ddx = p[ib] - p[ia], ddy = p[ib + 1] - p[ia + 1], ddz = p[ib + 2] - p[ia + 2];
      const d = Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz) || 1e-6;
      const f = (d - rest) / d * 0.5;
      ddx *= f; ddy *= f; ddz *= f;
      p[ia] += ddx; p[ia + 1] += ddy; p[ia + 2] += ddz;
      p[ib] -= ddx; p[ib + 1] -= ddy; p[ib + 2] -= ddz;
    }
    for (const [c, local] of CAPE.pins){
      _cv1.copy(local).applyMatrix4(m);
      const i = c * 3;
      p[i] = _cv1.x; p[i + 1] = _cv1.y; p[i + 2] = _cv1.z;
    }
  }
  const pushOut = (i, ax, ay, az, bx, by, bz, R) => {
    const abx = bx - ax, aby = by - ay, abz = bz - az;
    const tt = THREE.MathUtils.clamp(
      ((p[i] - ax) * abx + (p[i + 1] - ay) * aby + (p[i + 2] - az) * abz) /
      (abx * abx + aby * aby + abz * abz), 0, 1);
    const cx = ax + abx * tt, cy = ay + aby * tt, cz = az + abz * tt;
    const dx = p[i] - cx, dy = p[i + 1] - cy, dz = p[i + 2] - cz;
    const d2 = dx * dx + dy * dy + dz * dz;
    if (d2 < R * R){
      const d = Math.sqrt(d2) || 1e-6, f = (R - d) / d;
      p[i] += dx * f; p[i + 1] += dy * f; p[i + 2] += dz * f;
      pr[i] += dx * f * 0.9; pr[i + 1] += dy * f * 0.9; pr[i + 2] += dz * f * 0.9;
    }
  };
  const firstFree = CAPE.W * 3;   // pinned top row is exempt
  for (let i = 0; i < p.length; i += 3){
    if (i >= firstFree){
      pushOut(i, 0, 0.92, -0.005, 0, 1.40, -0.005, 0.162);                      // torso + belt
      if (p[i + 1] < 1.08){
        pushOut(i, jw[0], jw[1], jw[2], jw[3], jw[4], jw[5], 0.125);            // thigh L
        pushOut(i, jw[3], jw[4], jw[5], jw[6], jw[7], jw[8], 0.105);            // shin L
        pushOut(i, jw[9], jw[10], jw[11], jw[12], jw[13], jw[14], 0.125);       // thigh R
        pushOut(i, jw[12], jw[13], jw[14], jw[15], jw[16], jw[17], 0.105);      // shin R
      }
    }
    if (p[i + 1] < 0.025) p[i + 1] = 0.025;
  }
  CAPE.geo.attributes.position.needsUpdate = true;
  CAPE.geo.computeVertexNormals();
}

/* ============================================================
   ANIMATION — procedural poses baked into real AnimationClips
   (exported inside the GLB alongside the skeleton)
============================================================ */
function resetPose(){
  for (const [name] of BONE_DEFS){
    B[name].rotation.set(0, 0, 0);
    B[name].position.copy(restPos[name]);
  }
}
function relax(){
  B.upperArmL.rotation.z = 0.07;  B.upperArmR.rotation.z = -0.07;
  B.upperArmL.rotation.x = 0.04;  B.upperArmR.rotation.x = 0.04;
  B.forearmL.rotation.x = -0.14;  B.forearmR.rotation.x = -0.14;
}
function poseIdle(u){
  relax();
  const br = Math.sin(u);
  B.chest.rotation.x = 0.028 * br;
  B.spine.rotation.x = 0.012 * br;
  B.chest.rotation.y = 0.03 * Math.sin(u + 1.2);
  B.head.rotation.y = 0.08 * Math.sin(u + 2.1);
  B.head.rotation.x = 0.02 * Math.sin(u * 2 + 0.5);
  B.upperArmL.rotation.x += 0.03 * Math.sin(u * 2);
  B.upperArmR.rotation.x += 0.03 * Math.sin(u * 2 + 0.7);
  B.pelvis.rotation.y = 0.02 * Math.sin(u + 0.6);
  B.pelvis.position.y += 0.008 * Math.sin(u * 2);
}
function gait(u, A, knee, armA, elbow, lean, bobA, toe){
  relax();
  B.thighL.rotation.x = -A * Math.sin(u);
  B.thighR.rotation.x =  A * Math.sin(u);
  B.shinL.rotation.x = 0.12 + knee * Math.max(0, Math.sin(u));
  B.shinR.rotation.x = 0.12 + knee * Math.max(0, -Math.sin(u));
  B.footL.rotation.x = -(B.thighL.rotation.x + B.shinL.rotation.x) * 0.62 + toe * Math.max(0, Math.sin(u + 3.6));
  B.footR.rotation.x = -(B.thighR.rotation.x + B.shinR.rotation.x) * 0.62 + toe * Math.max(0, Math.sin(u + 0.46));
  B.upperArmL.rotation.x +=  armA * Math.sin(u);
  B.upperArmR.rotation.x += -armA * Math.sin(u);
  B.forearmL.rotation.x = -elbow - 0.32 * Math.max(0, -Math.sin(u));
  B.forearmR.rotation.x = -elbow - 0.32 * Math.max(0, Math.sin(u));
  B.pelvis.rotation.z = 0.055 * Math.sin(u);
  B.pelvis.rotation.y = 0.10 * Math.sin(u);
  B.chest.rotation.z = -0.05 * Math.sin(u);
  B.chest.rotation.y = -0.15 * Math.sin(u);
  B.chest.rotation.x = lean;
  B.head.rotation.y = 0.05 * Math.sin(u);
  B.head.rotation.x = -lean * 0.55;
  B.pelvis.position.y += -0.012 + bobA * Math.abs(Math.cos(u));
}
const poseWalk = u => gait(u, 0.55, 0.80, 0.48, 0.28, 0.06, 0.030, 0.22);
const poseRun  = u => gait(u, 0.92, 1.15, 0.78, 0.88, 0.22, 0.052, 0.36);
function poseWave(u){
  relax();
  B.chest.rotation.x = 0.02 * Math.sin(u);
  B.shoulderR.rotation.z = -0.18;
  B.upperArmR.rotation.z = -1.72 + 0.05 * Math.sin(u * 3);
  B.upperArmR.rotation.x = -0.30;
  B.forearmR.rotation.z = -0.30 + 0.55 * Math.sin(u * 3);
  B.forearmR.rotation.x = -0.25;
  B.handR.rotation.z = 0.25 * Math.sin(u * 3 + 0.7);
  B.head.rotation.z = -0.07;
  B.head.rotation.y = -0.12;
  B.chest.rotation.y = -0.06;
  B.pelvis.position.y += 0.005 * Math.sin(u * 2);
}
function poseTPose(){
  B.shoulderL.rotation.z = 0.12;  B.upperArmL.rotation.z = 1.33;
  B.shoulderR.rotation.z = -0.12; B.upperArmR.rotation.z = -1.33;
}

function bake(name, dur, fn){
  const fps = 30, frames = Math.max(2, Math.round(dur * fps)) + 1;
  const times = new Float32Array(frames);
  const qData = bones.map(() => new Float32Array(frames * 4));
  const pData = new Float32Array(frames * 3);
  for (let f = 0; f < frames; f++){
    const t = (f / (frames - 1)) * dur;
    times[f] = t;
    resetPose();
    fn((t / dur) * Math.PI * 2, t);
    bones.forEach((b, i) => b.quaternion.toArray(qData[i], f * 4));
    B.pelvis.position.toArray(pData, f * 3);
  }
  const tracks = bones.map((b, i) => new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, qData[i]));
  tracks.push(new THREE.VectorKeyframeTrack(B.pelvis.name + '.position', times, pData));
  return new THREE.AnimationClip(name, dur, tracks);
}
const clips = [
  bake('Idle', 4, poseIdle),
  bake('Walk', 0.75, poseWalk),
  bake('Run', 0.5, poseRun),
  bake('Wave', 2.4, poseWave),
  bake('T-Pose', 1, poseTPose),
];
resetPose();
const mixer = new THREE.AnimationMixer(charGroup);
const actions = {};
for (const c of clips){ actions[c.name] = mixer.clipAction(c); }
let currentAction = null;
function setAnim(name){
  const next = actions[name];
  if (!next || next === currentAction) return;
  next.reset().fadeIn(0.25).play();
  if (currentAction) currentAction.fadeOut(0.25);
  currentAction = next;
  if (ui.animChanged) ui.animChanged(name);
}


/* ---------------- GLB writer — glTF 2.0 with skin + animations ---------------- */
function buildGLB(){
  const json = {
    asset: { version: '2.0', generator: 'OuterVerse Exosuit Forge' },
    scene: 0, scenes: [{ name: 'Scene', nodes: [] }],
    nodes: [], meshes: [], skins: [], materials: [],
    accessors: [], bufferViews: [], buffers: [],
    animations: [], samplers: [], textures: [], images: [],
  };
  const binParts = []; let binLen = 0;
  const pad4 = n => (4 - (n % 4)) % 4;
  function pushBV(arr, target){
    const pad = pad4(binLen);
    if (pad){ binParts.push(new Uint8Array(pad)); binLen += pad; }
    const bytes = new Uint8Array(arr.buffer, arr.byteOffset, arr.byteLength);
    const bv = { buffer: 0, byteOffset: binLen, byteLength: bytes.byteLength };
    if (target) bv.target = target;
    json.bufferViews.push(bv);
    binParts.push(bytes); binLen += bytes.byteLength;
    return json.bufferViews.length - 1;
  }
  const COMPS = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4, MAT4: 16 };
  function accessor(arr, type, compType, opts = {}){
    const comps = COMPS[type];
    const a = { bufferView: pushBV(arr, opts.target), componentType: compType,
                count: arr.length / comps, type };
    if (opts.minmax){
      const mn = new Array(comps).fill(Infinity), mx = new Array(comps).fill(-Infinity);
      for (let i = 0; i < arr.length; i += comps)
        for (let c = 0; c < comps; c++){
          const v = arr[i + c];
          if (v < mn[c]) mn[c] = v;
          if (v > mx[c]) mx[c] = v;
        }
      a.min = mn; a.max = mx;
    }
    json.accessors.push(a);
    return json.accessors.length - 1;
  }

  // nodes: bones first, so node index === joint index
  bones.forEach((b, i) => {
    const rp = restPos[BONE_DEFS[i][0]];
    const node = { name: b.name, translation: [rp.x, rp.y, rp.z] };
    const kids = b.children.filter(c => c.isBone).map(c => bones.indexOf(c));
    if (kids.length) node.children = kids;
    json.nodes.push(node);
  });
  json.scenes[0].nodes.push(0);

  const ibm = new Float32Array(bones.length * 16);
  skeleton.boneInverses.forEach((m, i) => ibm.set(m.elements, i * 16));
  json.skins.push({ name: 'OuterRig', joints: bones.map((_, i) => i),
    inverseBindMatrices: accessor(ibm, 'MAT4', 5126), skeleton: 0 });

  // canvas textures (embedded PNGs, deduped)
  const texIdx = new Map();
  function embedCanvas(cv){
    if (texIdx.has(cv)) return texIdx.get(cv);
    let idx = -1;
    try {
      const b64 = cv.toDataURL('image/png').split(',')[1];
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (!json.samplers.length)
        json.samplers.push({ magFilter: 9729, minFilter: 9729, wrapS: 33071, wrapT: 33071 });
      json.images.push({ bufferView: pushBV(bytes), mimeType: 'image/png' });
      json.textures.push({ source: json.images.length - 1, sampler: 0 });
      idx = json.textures.length - 1;
    } catch (e) {}
    texIdx.set(cv, idx);
    return idx;
  }
  function embedTex(tex){ return embedCanvas(tex.image); }

  let usesExt = false;
  function matIndex(m, name){
    const mat = { name, doubleSided: true,
      pbrMetallicRoughness: {
        baseColorFactor: [m.color.r, m.color.g, m.color.b, 1],
        metallicFactor: m.metalness ?? 0,
        roughnessFactor: m.roughness ?? 1,
      } };
    if (m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b) > 0){
      mat.emissiveFactor = [Math.min(m.emissive.r, 1), Math.min(m.emissive.g, 1), Math.min(m.emissive.b, 1)];
      const s = m.emissiveIntensity ?? 1;
      if (s !== 1){
        usesExt = true;
        mat.extensions = { KHR_materials_emissive_strength: { emissiveStrength: s } };
      }
    }
    if (m === faceMat){
      let ti = -1;
      try {
        const tc = document.createElement('canvas'); tc.width = 512; tc.height = 512;
        drawFaceInto(tc.getContext('2d'), true);
        ti = embedCanvas(tc);
      } catch (e) {}
      if (ti >= 0){
        mat.pbrMetallicRoughness.baseColorFactor = [1, 1, 1, 1];
        mat.pbrMetallicRoughness.baseColorTexture = { index: ti };
        mat.emissiveTexture = { index: ti };
      }
      mat.alphaMode = 'BLEND';
    } else {
      if (m.map){
        const ti = embedTex(m.map);
        if (ti >= 0){
          mat.pbrMetallicRoughness.baseColorFactor = [1, 1, 1, 1];
          mat.pbrMetallicRoughness.baseColorTexture = { index: ti };
        }
      }
      if (m.emissiveMap){
        const ti = embedTex(m.emissiveMap);
        if (ti >= 0) mat.emissiveTexture = { index: ti };
      }
    }
    json.materials.push(mat);
    return json.materials.length - 1;
  }

  for (const mesh of suitMeshes){
    const g = mesh.geometry;
    json.meshes.push({ name: mesh.name, primitives: [{
      attributes: {
        POSITION:   accessor(g.attributes.position.array, 'VEC3', 5126, { target: 34962, minmax: true }),
        NORMAL:     accessor(g.attributes.normal.array, 'VEC3', 5126, { target: 34962 }),
        TEXCOORD_0: accessor(g.attributes.uv.array, 'VEC2', 5126, { target: 34962 }),
        JOINTS_0:   accessor(g.attributes.skinIndex.array, 'VEC4', 5123, { target: 34962 }),
        WEIGHTS_0:  accessor(g.attributes.skinWeight.array, 'VEC4', 5126, { target: 34962 }),
      },
      indices: accessor(g.index.array, 'SCALAR', 5125, { target: 34963 }),
      material: matIndex(mesh.material, mesh.name + '_mat'),
      mode: 4,
    }] });
    json.nodes.push({ name: mesh.name, mesh: json.meshes.length - 1, skin: 0 });
    json.scenes[0].nodes.push(json.nodes.length - 1);
  }

  if (CAPE.on && CAPE.mesh){
    const n = CAPE.pos.length / 3;
    B.chest.updateWorldMatrix(true, false);
    const M = new THREE.Matrix4().copy(B.chest.matrixWorld).invert()
      .premultiply(new THREE.Matrix4().copy(skeleton.boneInverses[BI.chest]).invert());
    const cpos = new Float32Array(n * 3);
    const nm = new THREE.Matrix3().getNormalMatrix(M);
    const cnor = new Float32Array(n * 3);
    const srcN = CAPE.geo.attributes.normal.array;
    const v = new THREE.Vector3();
    for (let i = 0; i < n; i++){
      v.fromArray(CAPE.pos, i * 3).applyMatrix4(M).toArray(cpos, i * 3);
      v.fromArray(srcN, i * 3).applyMatrix3(nm).normalize().toArray(cnor, i * 3);
    }
    const csi = new Uint16Array(n * 4), csw = new Float32Array(n * 4);
    for (let i = 0; i < n; i++){ csi[i * 4] = BI.chest; csw[i * 4] = 1; }
    const cidx = Uint32Array.from(CAPE.geo.index.array);
    json.meshes.push({ name: 'OuterVerse_cape', primitives: [{
      attributes: {
        POSITION: accessor(cpos, 'VEC3', 5126, { target: 34962, minmax: true }),
        NORMAL: accessor(cnor, 'VEC3', 5126, { target: 34962 }),
        TEXCOORD_0: accessor(new Float32Array(CAPE.geo.attributes.uv.array), 'VEC2', 5126, { target: 34962 }),
        JOINTS_0: accessor(csi, 'VEC4', 5123, { target: 34962 }),
        WEIGHTS_0: accessor(csw, 'VEC4', 5126, { target: 34962 }),
      },
      indices: accessor(cidx, 'SCALAR', 5125, { target: 34963 }),
      material: matIndex(capeMat, 'OuterVerse_cape_mat'),
      mode: 4,
    }] });
    json.nodes.push({ name: 'OuterVerse_cape', mesh: json.meshes.length - 1, skin: 0 });
    json.scenes[0].nodes.push(json.nodes.length - 1);
  }

  const nodeByName = {};
  bones.forEach((b, i) => { nodeByName[b.name] = i; });
  for (const clip of clips){
    const anim = { name: clip.name, samplers: [], channels: [] };
    for (const tr of clip.tracks){
      const dot = tr.name.lastIndexOf('.');
      const node = nodeByName[tr.name.slice(0, dot)];
      if (node === undefined) continue;
      const path = tr.name.slice(dot + 1) === 'quaternion' ? 'rotation' : 'translation';
      anim.samplers.push({
        input: accessor(new Float32Array(tr.times), 'SCALAR', 5126, { minmax: true }),
        output: accessor(new Float32Array(tr.values), path === 'rotation' ? 'VEC4' : 'VEC3', 5126),
        interpolation: 'LINEAR',
      });
      anim.channels.push({ sampler: anim.samplers.length - 1, target: { node, path } });
    }
    json.animations.push(anim);
  }

  if (usesExt) json.extensionsUsed = ['KHR_materials_emissive_strength'];
  json.buffers.push({ byteLength: binLen });
  for (const k of ['textures', 'images', 'samplers', 'animations'])
    if (!json[k].length) delete json[k];

  const jsonBytes = new TextEncoder().encode(JSON.stringify(json));
  const jPad = pad4(jsonBytes.length), bPad = pad4(binLen);
  const total = 12 + 8 + jsonBytes.length + jPad + 8 + binLen + bPad;
  const out = new ArrayBuffer(total);
  const dv = new DataView(out), u8 = new Uint8Array(out);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, total, true);
  dv.setUint32(12, jsonBytes.length + jPad, true); dv.setUint32(16, 0x4E4F534A, true);
  u8.set(jsonBytes, 20);
  for (let i = 0; i < jPad; i++) u8[20 + jsonBytes.length + i] = 0x20;
  let o = 20 + jsonBytes.length + jPad;
  dv.setUint32(o, binLen + bPad, true); dv.setUint32(o + 4, 0x004E4942, true); o += 8;
  for (const part of binParts){ u8.set(part, o); o += part.byteLength; }
  return { buffer: out, name: 'outerverse_' + cleanSeed() + '.glb' };
}

class MiniOrbit{
  constructor(cam, dom, target){
    this.cam = cam; this.dom = dom; this.target = target;
    this.s = new THREE.Spherical().setFromVector3(cam.position.clone().sub(target));
    this.g = { theta: this.s.theta, phi: this.s.phi, r: this.s.radius };
    this.autoRotate = true;
    this.pts = new Map(); this.pinch = 0;
    dom.style.touchAction = 'none';
    dom.addEventListener('pointerdown', e => {
      dom.setPointerCapture(e.pointerId);
      this.pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.pts.size === 2){
        const a = [...this.pts.values()];
        this.pinch = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
      }
    });
    dom.addEventListener('pointermove', e => {
      if (!this.pts.has(e.pointerId)) return;
      const prev = this.pts.get(e.pointerId);
      this.pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (this.pts.size === 1){
        this.g.theta -= (e.clientX - prev[0]) * 0.0052;
        this.g.phi   -= (e.clientY - prev[1]) * 0.0052;
      } else if (this.pts.size === 2){
        const a = [...this.pts.values()];
        const d = Math.hypot(a[0][0] - a[1][0], a[0][1] - a[1][1]);
        if (this.pinch > 0) this.g.r *= this.pinch / d;
        this.pinch = d;
      }
      this.clampGoal();
    });
    const drop = e => { this.pts.delete(e.pointerId); this.pinch = 0; };
    dom.addEventListener('pointerup', drop);
    dom.addEventListener('pointercancel', drop);
    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.g.r *= e.deltaY > 0 ? 1.09 : 0.92;
      this.clampGoal();
    }, { passive: false });
  }
  clampGoal(){
    this.g.phi = THREE.MathUtils.clamp(this.g.phi, 0.12, 1.52);
    this.g.r = THREE.MathUtils.clamp(this.g.r, 1.1, 7.5);
  }
  update(dt){
    if (this.autoRotate && this.pts.size === 0) this.g.theta -= 0.14 * dt;
    const k = 1 - Math.pow(0.0001, dt);
    this.s.theta += (this.g.theta - this.s.theta) * k;
    this.s.phi += (this.g.phi - this.s.phi) * k;
    this.s.radius += (this.g.r - this.s.radius) * k;
    this.cam.position.setFromSpherical(this.s).add(this.target);
    this.cam.lookAt(this.target);
  }
}

class Post{
  constructor(r){
    this.r = r;
    const T = THREE.HalfFloatType;
    this.rtScene = new THREE.WebGLRenderTarget(2, 2, { type: T, samples: 4 });
    this.rtA = new THREE.WebGLRenderTarget(2, 2, { type: T });
    this.rtB = new THREE.WebGLRenderTarget(2, 2, { type: T });
    this.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    this.qs = new THREE.Scene();
    this.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
    this.quad.frustumCulled = false;
    this.qs.add(this.quad);
    const V = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
    const mk = (frag, uni) => new THREE.ShaderMaterial({
      vertexShader: V, fragmentShader: frag, uniforms: uni, depthTest: false, depthWrite: false });
    this.matBright = mk(
      'uniform sampler2D tex; uniform float threshold; varying vec2 vUv;' +
      'void main(){ vec3 c = texture2D(tex, vUv).rgb;' +
      ' float l = max(c.r, max(c.g, c.b));' +
      ' float f = max(l - threshold, 0.0) / max(l, 1e-4);' +
      ' gl_FragColor = vec4(c * f, 1.0); }',
      { tex: { value: null }, threshold: { value: 1.15 } });
    this.matBlur = mk(
      'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;' +
      'void main(){ vec3 c = texture2D(tex, vUv).rgb * 0.227027;' +
      ' c += (texture2D(tex, vUv + dir).rgb + texture2D(tex, vUv - dir).rgb) * 0.194594;' +
      ' c += (texture2D(tex, vUv + dir*2.0).rgb + texture2D(tex, vUv - dir*2.0).rgb) * 0.121621;' +
      ' c += (texture2D(tex, vUv + dir*3.0).rgb + texture2D(tex, vUv - dir*3.0).rgb) * 0.054054;' +
      ' c += (texture2D(tex, vUv + dir*4.0).rgb + texture2D(tex, vUv - dir*4.0).rgb) * 0.016216;' +
      ' gl_FragColor = vec4(c, 1.0); }',
      { tex: { value: null }, dir: { value: new THREE.Vector2() } });
    this.matFinal = mk(
      'uniform sampler2D base; uniform sampler2D bloomTex;' +
      'uniform float strength; uniform float exposure; varying vec2 vUv;' +
      'vec3 aces(vec3 x){ return clamp(x*(2.51*x+0.03)/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }' +
      'vec3 toSrgb(vec3 c){ return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c)); }' +
      'void main(){ vec3 c = texture2D(base, vUv).rgb + texture2D(bloomTex, vUv).rgb * strength;' +
      ' gl_FragColor = vec4(toSrgb(aces(c * exposure)), 1.0); }',
      { base: { value: null }, bloomTex: { value: null }, strength: { value: 0.85 }, exposure: { value: 1.12 } });
    this.setSize(innerWidth, innerHeight);
  }
  setSize(w, h){
    const pr = this.r.getPixelRatio();
    this.rtScene.setSize((w * pr) | 0, (h * pr) | 0);
    this.hw = Math.max(1, (w * pr / 2) | 0);
    this.hh = Math.max(1, (h * pr / 2) | 0);
    this.rtA.setSize(this.hw, this.hh);
    this.rtB.setSize(this.hw, this.hh);
  }
  pass(mat, from, to){
    mat.uniforms.tex.value = from.texture;
    this.quad.material = mat;
    this.r.setRenderTarget(to);
    this.r.render(this.qs, this.cam);
  }
  render(scene, cam, fx){
    const r = this.r;
    r.setRenderTarget(this.rtScene);
    r.render(scene, cam);
    if (fx){
      this.pass(this.matBright, this.rtScene, this.rtA);
      for (let i = 0; i < 2; i++){
        this.matBlur.uniforms.dir.value.set((1 + i * 1.6) / this.hw, 0);
        this.pass(this.matBlur, this.rtA, this.rtB);
        this.matBlur.uniforms.dir.value.set(0, (1 + i * 1.6) / this.hh);
        this.pass(this.matBlur, this.rtB, this.rtA);
      }
    }
    this.matFinal.uniforms.base.value = this.rtScene.texture;
    this.matFinal.uniforms.bloomTex.value = this.rtA.texture;
    this.matFinal.uniforms.strength.value = fx ? 0.85 : 0.0;
    this.quad.material = this.matFinal;
    r.setRenderTarget(null);
    r.render(this.qs, this.cam);
  }
}

============================================================ */
const clock = new THREE.Clock();
let talkT = 0, blinkT = 1.6, blinkClose = 0;
function renderFrame(dt){
  controls.update(dt);
  mixer.update(dt);
  updateCape(dt);
  if (helmFace()){
    if (state.talk){
      talkT -= dt;
      if (talkT <= 0){
        talkT = 0.08 + Math.random() * 0.14;
        setViseme(VISEMES[(Math.random() * VISEMES.length) | 0]);
      }
    }
    if (blinkClose > 0){
      blinkClose -= dt;
      if (blinkClose <= 0) setEyes(false);
    } else {
      blinkT -= dt;
      if (blinkT <= 0){
        blinkT = Math.random() < 0.18 ? 0.25 : 2.2 + Math.random() * 2.6;
        blinkClose = 0.11;
        setEyes(true);
      }
    }
  }
  const et = clock.elapsedTime;
  ring.rotation.z += dt * 0.4;
  ring2.rotation.z -= dt * 0.15;
  ringMat.emissiveIntensity = 2.6 + Math.sin(et * 2.2) * 0.5;
  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < dp.count; i++){
    let y = dp.getY(i) + dt * 0.05;
    if (y > 2.4) y = 0.15;
    dp.setY(i, y);
  }
  dp.needsUpdate = true;
  post.render(scene, camera, state.fx);
}
function loop(){
  requestAnimationFrame(loop);
  renderFrame(Math.min(clock.getDelta(), 0.05));
}

/* OuterVerse handoff: opened from the game \u2192 resume editing the CURRENT suit */
try{
  if (location.hash.indexOf('ov') >= 0){
    const cur = JSON.parse(localStorage.getItem('ov_exo_current') || 'null');
    if (cur && cur.state){
      const st = cur.state;
      if (st.seed) state.seed = st.seed;
      if (st.name) state.name = st.name;
      if (st.colors) Object.assign(state.colors, st.colors);
      if (st.parts) Object.assign(state.parts, st.parts);
      if (st.surf) for (const k in st.surf) if (state.surf[k]) Object.assign(state.surf[k], st.surf[k]);
      if (st.stripes !== undefined) state.stripes = !!st.stripes;
      if (st.greebles !== undefined) state.greebles = !!st.greebles;
      if (st.glowInt) state.glowInt = st.glowInt;
    }
  }
}catch(e){}
buildUI();
buildSuit();
setAnim('Idle');
loop();
requestAnimationFrame(() => requestAnimationFrame(() =>
  document.getElementById('loading').classList.add('hide')));
</script>
